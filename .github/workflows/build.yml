name: Build

# Every push and pull request builds the app. Pushing a tag like v1.0 also publishes
# Stillpoint.zip as a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          # Ad-hoc signed ("-"): no Apple Developer account, so no notarization.
          xcodebuild build \
            -project MindfulBell.xcodeproj \
            -scheme MindfulBell \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            | tee xcodebuild.log | grep -E '^(\*\*|.*(error|warning):)' || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Check the app
        run: |
          APP=build/Build/Products/Release/Stillpoint.app
          codesign --verify --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP" | grep -q com.apple.security.app-sandbox
          # Universal, so it runs on Intel Macs as well as Apple silicon.
          lipo -archs "$APP/Contents/MacOS/Stillpoint" | tee /dev/stderr | grep -q x86_64
          lipo -archs "$APP/Contents/MacOS/Stillpoint" | grep -q arm64
          ditto -c -k --keepParent "$APP" Stillpoint.zip

      - uses: actions/upload-artifact@v6
        with:
          name: Stillpoint
          path: Stillpoint.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Stillpoint.zip \
            --title "Stillpoint ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md

      - name: Update the Homebrew cask
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 Stillpoint.zip | cut -d' ' -f1)
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            Casks/stillpoint.rb
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the Homebrew cask to $VERSION"
          git push origin main
